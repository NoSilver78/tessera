[project]
name = "tessera"
version = "0.1.0"
description = "RBAC for Home Assistant — Rollen × Area/Entity × view/operate/change, durchgesetzt auf nativen HA-Policies."
# Deliberately the *lowest* Python Tessera must still run on — not the one CI
# runs. Current HA (2026.3+) requires Python >= 3.14.2, so CI installs 3.14 to
# get a current Home Assistant, but `off`/`monitor` are documented as working on
# any HA version, including older ones on Python 3.13. Raising the targets below
# to py314 makes Black rewrite `except (A, B):` into the 3.14-only `except A, B:`
# (PEP 758), which would break the import on those installs.
requires-python = ">=3.13"
readme = "README.md"
license = { text = "MIT" }

[tool.ruff]
extend-exclude = ["spike"]
target-version = "py313"
line-length = 88
src = ["custom_components"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF", "D"]
# D = pydocstyle (Docstrings); Google-Konvention
[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.black]
extend-exclude = "spike"
target-version = ["py313"]
line-length = 88

[tool.mypy]
# 3.14 unlike ruff/black above, because mypy parses the *installed Home
# Assistant* too, and current HA uses PEP 758 `except A, B:` in its own source —
# at 3.13 mypy aborts on homeassistant/core.py before it ever reaches Tessera.
# Our own 3.13 compatibility is still enforced: ruff at target py313 rejects that
# syntax in this repo (verified), so nothing here can drift into 3.14-only code.
python_version = "3.14"
strict = true
warn_unreachable = true
files = ["custom_components/tessera"]

[[tool.mypy.overrides]]
module = "homeassistant.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[[tool.mypy.overrides]]
module = "voluptuous"
ignore_missing_imports = true
